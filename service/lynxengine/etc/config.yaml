# LynxGraph Engine gRPC服务配置

# go-zero gRPC服务配置
Name: lynxengine.rpc
ListenOn: 0.0.0.0:9999

# 日志配置
Log:
  ServiceName: "lynxengine-service"
  Mode: "console"
  Encoding: "json"
  Path: "./logs"
  Level: "info"
  MaxContentLength: 4096
  Compress: true
  Stat: true
  KeepDays: 7
  StackCooldownMillis: 100
  MaxBackups: 5
  MaxSize: 100
  Rotation: "size"

# 运行模式
Mode: "dev"

# 链路追踪配置
Telemetry:
  Name: "lynxengine-service"
  Endpoint: "http://jaeger:14268/api/traces"
  Sampler: 1.0
  Batcher: "jaeger"

# 开发服务器配置
DevServer:
  Enabled: true
  Port: 6064
  HealthPath: "/healthz"
  MetricsPath: "/metrics"

# Etcd服务注册（go-zero）
Etcd:
  Hosts:
    - etcd:2379
  Key: lynxengine.rpc

# PostgreSQL数据库配置（顶层配置，在ServiceContext中创建连接）
DataSource:
  Driver: "postgres"
  Host: "postgres"
  Port: 5432
  Database: "nexlyn"
  Username: "nexlyn"
  Password: "Quanmate.2025"

# MongoDB配置（顶层配置，在ServiceContext中创建连接）
MongoDBConf:
  URI: "mongodb://nexlyn:Quanmate.2025@mongodb:27017"
  DB: "nexlyn"
  Collection: "graph_details"
  CacheConf:
    - Host: "redis:6379"
      Pass: "Quanmate.2025"
      Type: "node"

# Redis配置（用于Skylark引擎）
RedisConf:
  Host: "redis:6379"
  Pass: "Quanmate.2025"
  Type: "node"

# LynxGraph引擎配置（使用pkg/lynxgraph/engine.Config）
LynxEngine:
  # 运行模式
  RunMode: "engine"

  # Redis键前缀
  KeyPrefix: "lynxgraph:"

  # 图上下文TTL（1小时）
  GraphContextTTL: 1h

  # 信息原子TTL（30分钟）
  InfoAtomTTL: 30m

  # Redis缓存配置（用于InfoAtom和Graph）
  CacheConf:
    - Host: "redis:6379"
      Pass: "Quanmate.2025"
      Type: "node"

  # Etcd配置（用于监听配置变更）
  EtcdConfig:
    Key: "/nexlyn/lynxgraph"
    endpoints:
      - "etcd:2379"
    dial_timeout: 5s
    username: ""
    password: ""

  # 逻辑块注册表配置（目前为空）
  BlockConfig: {}

  # 调度器配置
  DispatcherConfig:
    # 并行执行不同图的处理
    ParallelExecution: true
    # 节点失败时不继续处理同图中的其他节点
    ContinueOnNodeFailure: false
    # 执行超时时间（毫秒）
    TimeoutMs: 30000
    # 最大并行处理的图数量
    MaxParallelGraphs: 10
    # 工作池工作者数量
    NumWorkers: 20
    # 工作队列大小
    WorkerQueueSize: 1000

# Skylark引擎配置（可选，用于SkylarkJourneyCreate逻辑块）
SkylarkConfig:
  # 缓存配置
  Cache:
    # API 模块缓存配置
    FieldMappingsCacheExpiry: 3600
    # 分布式锁配置
    FlowLockExpiry: 60
    FlowLockRetryCount: 3
    FlowLockRetryInterval: 100
    # Query 模块缓存配置
    FlowListCacheTTL: 3600    # Flow 列表缓存 TTL（秒）
    FlowFieldsCacheTTL: 3600  # Flow 字段缓存 TTL（秒）
    UserNameCacheTTL: 3600    # 用户名缓存 TTL（秒）
    # Mapping 模块缓存配置
    OrgMappingCacheTTL: 3600      # 单个组织映射缓存 TTL（秒）
    OrgMappingListCacheTTL: 3600  # 组织映射列表缓存 TTL（秒）
    # Stats 模块缓存配置
    StatsCacheTTL: 300        # 统计结果缓存 TTL（秒）

  # 平台配置管理器配置
  Platform:
    PlatformConfigCacheTTL: 30m  # 平台配置缓存时间（30分钟）

  # 事件配置管理器配置
  Event:
    EventConfigCacheTTL: 10m      # 单个事件配置缓存时间（10分钟）
    EventConfigListCacheTTL: 5m   # 事件配置列表缓存时间（5分钟）

  # 组织映射管理器配置
  Mapping:
    OrgMappingCacheTTL: 168h      # 组织映射缓存时间（7天）

  # 远程查询管理器配置
  Query:
    FlowListCacheTTL: 1h          # flows列表缓存时间（1小时）
    FlowFieldsCacheTTL: 1h        # flow字段列表缓存时间（1小时）
    UserNameCacheTTL: 24h         # 用户名缓存时间（24小时）
    MaxPageSize: 1000             # 每页最大记录数
    DefaultPageSize: 20           # 默认每页记录数
    QueryTimeout: 30s             # 单次查询超时时间（30秒）

  # 统计分析管理器配置
  Stats:
    UserNameCacheTTL: 24h         # 用户名缓存时间（24小时）
    StatsCacheTTL: 5m             # 统计数据缓存时间（5分钟）

# IoTQuery gRPC客户端配置
IoTQueryClient:
  Endpoints:
    - iotquery:9993
  Timeout: 5000
  NonBlock: true

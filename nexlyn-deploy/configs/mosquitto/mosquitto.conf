# Mosquitto 配置文件

# 监听端口
listener 1883
protocol mqtt

# WebSocket 监听（可选）
listener 9001
protocol websockets

# 允许匿名访问（开发环境）
# 生产环境建议设置为 false 并配置用户认证
allow_anonymous true

# 持久化客户端信息
persistence true
persistence_location /mosquitto/data/

# 日志配置
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# 连接配置
max_connections -1
max_keepalive 65535

# 消息配置
message_size_limit 0

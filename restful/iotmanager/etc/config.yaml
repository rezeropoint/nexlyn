# 服务名称，用于标识服务
Name: iot-service
# 日志配置，定义了日志模式、格式、路径、级别等
Log:
  # 服务名称
  ServiceName: "iot-service"
  # 日志模式（可选项：console, file, volume）
  Mode: "console"
  # 日志格式（可选项：json, plain）
  Encoding: "json"
  # 日志文件路径
  Path: "./logs"
  # 日志级别（可选项：debug, info, error, severe）
  Level: "debug"
  # 最大日志内容长度
  MaxContentLength: 4096
  # 是否压缩日志
  Compress: true
  # 启用日志统计
  Stat: true
  # 日志保留天数
  KeepDays: 7
  # 堆栈打印冷却时间（毫秒）
  StackCooldownMillis: 100
  # 最大日志备份数量
  MaxBackups: 5
  # 单个日志文件最大大小（MB）
  MaxSize: 100
  # 日志文件分割模式（可选项：daily, size）
  Rotation: "size"

# 运行模式（可选项：dev, test, rt, pre, pro）
Mode: "dev"

# 链路追踪配置，定义了追踪服务的端点和采样率
Telemetry:
  # 服务名称
  Name: "iot-service"
  # Jaeger 追踪端点
  Endpoint: "http://jaeger:14268/api/traces"
  # 采样率
  Sampler: 1.0
  # 批处理方式（可选项：jaeger, zipkin, otlpgrpc, otlphttp）
  Batcher: "jaeger"

# 开发服务器配置，包含健康检查和指标监控的端口和路径设置
DevServer:
  # 启用开发服务器
  Enabled: true
  # 开发服务器端口
  Port: 6060
  # 健康检查路径
  HealthPath: "/healthz"
  # 指标监控路径
  MetricsPath: "/metrics"

# grpc服务器端口
ListenOn: 0.0.0.0:9999

# 服务器监听地址
Host: 0.0.0.0
# 服务器监听端口
Port: 8888
# 最大并发连接数限制
MaxConns: 10000
# 最大请求体大小
MaxBytes: 1048576
# 请求处理超时时间（毫秒）
Timeout: 3000
# CPU 使用率阈值，范围是 0 到 1000，表示 0% 到 100%
CpuThreshold: 900

# 请求超时时间
RequestTimeout: 30s

# 缓存配置
CacheConf:
  - Host: "redis:6379"
    Pass: "Quanmate.2025"
    Type: "node"

# Redis 配置
RedisConf:
  Host: "redis:6379"
  Pass: "Quanmate.2025"
  Type: "node"

# 数据库配置
DataSource:
  # 数据库驱动
  Driver: "postgres"
  # 数据库主机
  Host: "postgres"
  # 数据库端口
  Port: 5432
  # 数据库名
  Database: "nexlyn"
  # 用户名
  Username: "nexlyn"
  # 密码
  Password: "Quanmate.2025"

# JWT 认证配置
Auth:
  AccessSecret: "Rezeropoint"
  AccessExpire: 86400  # 24小时，单位：秒

# Etcd 配置
EtcdConfig:
  Hosts:
    - "etcd:2379"
  User: ""
  Pass: ""
  Configs:
    - "mqtt-"
    - "skylark-"
  RootPath: "/nexlyn/iot"

# MQTT Broker 配置
MqttConfig:
  Broker: "tcp://nexlyn-mqtt:1883"
  ClientID: "iot-service"
  Username: ""
  Password: ""
  ConnectTimeout: 5s
  PingTimeout: 10s
  KeepAlive: 60s
  MaxReconnectInterval: 10s
  # 算法能力缓存时长（秒），默认7200秒（2小时），设置为0表示禁用缓存
  CapabilitiesCacheTTL: 7200

# ClickHouse 时序数据库配置
ClickHouseConfig:
  Address: "clickhouse:9000"
  Database: "nexlyn"
  Username: "nexlyn"
  Password: "Quanmate.2025"
  MaxOpenConns: 10
  MaxIdleConns: 5
  ConnMaxLifetime: 3600s
  BatchSize: 100
  FlushInterval: 1s
  # TTL配置（强制必填）
  # 为每个字段指定数据保存时长（天），范围：1-3650天
  # 注意：
  #   1. 仅在表创建时生效，已存在的表不受影响
  #   2. 未配置的字段将跳过表创建并记录错误日志
  #   3. 新增字段时必须在此处添加对应的TTL配置
  TTLOverrides:
    temperature: 180    # 温度数据保存180天
    humidity: 180       # 湿度数据保存180天
    smoke: 90           # 烟雾数据保存90天
    is_online: 30       # 在线状态保存30天
# Skylark 配置
SkylarkConfig:
  # 缓存配置（全局缓存设置）
  Cache:
    # API 模块缓存配置
    FieldMappingsCacheExpiry: 3600
    # 分布式锁配置
    FlowLockExpiry: 60
    FlowLockRetryCount: 3
    FlowLockRetryInterval: 100
    # Query 模块缓存配置
    FlowListCacheTTL: 3600    # Flow 列表缓存 TTL（秒）
    FlowFieldsCacheTTL: 3600  # Flow 字段缓存 TTL（秒）
    UserNameCacheTTL: 3600    # 用户名缓存 TTL（秒）
    # Mapping 模块缓存配置
    OrgMappingCacheTTL: 3600      # 单个组织映射缓存 TTL（秒）
    OrgMappingListCacheTTL: 3600  # 组织映射列表缓存 TTL（秒）
    # Stats 模块缓存配置
    StatsCacheTTL: 300        # 统计结果缓存 TTL（秒）

  # 平台配置管理器配置
  Platform:
    PlatformConfigCacheTTL: 30m  # 平台配置缓存时间（30分钟）

  # 事件配置管理器配置
  Event:
    EventConfigCacheTTL: 10m      # 单个事件配置缓存时间（10分钟）
    EventConfigListCacheTTL: 5m   # 事件配置列表缓存时间（5分钟）

  # 组织映射管理器配置
  Mapping:
    OrgMappingCacheTTL: 168h      # 组织映射缓存时间（7天）

  # 流程管理器配置
  Flows:
    FlowInfoCacheTTL: 3600        # Flow信息缓存时间（秒，默认1小时）
    VertexInfoCacheTTL: 3600      # 节点信息缓存时间（秒，默认1小时）
    VertexFieldCacheTTL: 3600     # 节点字段缓存时间（秒，默认1小时）

  # 远程查询管理器配置
  Query:
    FlowListCacheTTL: 1h          # flows列表缓存时间（1小时）
    FlowFieldsCacheTTL: 1h        # flow字段列表缓存时间（1小时）
    UserNameCacheTTL: 24h         # 用户名缓存时间（24小时）
    MaxPageSize: 1000             # 每页最大记录数
    DefaultPageSize: 20           # 默认每页记录数
    QueryTimeout: 30s             # 单次查询超时时间（30秒）

  # 统计分析管理器配置
  Stats:
    UserNameCacheTTL: 24h         # 用户名缓存时间（24小时）
    StatsCacheTTL: 5m             # 统计数据缓存时间（5分钟）

# LynxGraph 逻辑引擎配置
LynxGraphConfig:
  # gRPC 服务地址（Docker环境使用服务名，本地开发使用localhost:9992）
  grpcUrl: "lynxengine:9999"

# Casbin Watcher 配置
WatcherConfig:
  # Redis 配置
  Redis:
    network: "tcp"
    # Redis 服务器地址
    Addr: "redis:6379"
    # Redis 密码
    Password: "Quanmate.2025"
    # 数据库索引
    DB: 0
    channel: "casbinx"
    ignoreself: true